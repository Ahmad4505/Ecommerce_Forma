          format: email
        password:
          type: string
          writeOnly: true
          maxLength: 128
        store_name:
          type: string
        description:
          type: string
        phone:
          type: string
        address:
          type: string
        logo:
          type: string
          format: uri
        business_registration:
          type: string
      required:
      - address
      - description
      - email
      - logo
      - name
      - password
      - phone
      - store_name
    VendorStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - SUSPENDED
      type: string
      description: |-
        * `PENDING` - Pending
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `SUSPENDED` - Suspended
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Django HttpOnly session. Unsafe requests also require X-CSRFToken
        from /api/auth/csrf/.
